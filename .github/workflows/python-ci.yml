name: Python Code Quality

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest with coverage
        run: uv run pytest -q --cov=src --cov-report=term-missing:skip-covered --cov-fail-under=70

      - name: Smoke train
        run: |
          uv run python src/pytorch_research_template/train.py training.epochs=1 logging=default \
            paths.output_dir=/tmp/ml-template-smoke-out \
            paths.checkpoint_dir=/tmp/ml-template-smoke-out/checkpoints
