name: Enforce Branch Naming

on:
  pull_request:
    branches:
      - main

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch name prefix
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          # Regex allows specific prefixes, followed by anything (.*)
          REGEX="^(feat|fix|docs|chore|refactor|test|ci)/.*$"

          if [[ ! $BRANCH_NAME =~ $REGEX ]]; then
            echo "ERROR: Branch name '$BRANCH_NAME' is invalid!"
            echo "It must start with one of: feat/, fix/, docs/, chore/, refactor/, test/, ci/"
            echo "Example: feat/add-new-model"
            exit 1
          fi
          echo "Branch name is valid."
