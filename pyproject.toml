[project]
name = "ml-xai-introduction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "marcelele-0", email = "mnem12321@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ml-xai-introduction = "ml_xai_introduction:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "ruff>=0.12.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN"]
ignore = []
